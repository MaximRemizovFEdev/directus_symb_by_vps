map $http_upgrade $symbolika_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 443 ssl;
    server_name in.symbcorp.ru;

    client_max_body_size 2048m;
    ssl_certificate /etc/letsencrypt/live/in.symbcorp.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/in.symbcorp.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:8057;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $symbolika_connection_upgrade;
        proxy_read_timeout 86400;
    }
}

server {
    listen 443 ssl;
    server_name pay.symbcorp.ru;

    ssl_certificate /etc/letsencrypt/live/in.symbcorp.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/in.symbcorp.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location ^~ /symbolika-tbank/pay/ {
        proxy_pass http://127.0.0.1:8057;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /symbolika-tbank/notification {
        proxy_pass http://127.0.0.1:8057;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 404;
    }
}

server {
    listen 443 ssl;
    server_name symbcorp.ru www.symbcorp.ru;

    ssl_certificate /etc/letsencrypt/live/symbcorp.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/symbcorp.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Keep previously issued payment links and bank callbacks working.
    location ^~ /symbolika-tbank/pay/ {
        proxy_pass http://127.0.0.1:8057;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /symbolika-tbank/notification {
        proxy_pass http://127.0.0.1:8057;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 301 https://symb62.ru$request_uri;
    }
}

server {
    listen 80;
    server_name in.symbcorp.ru;
    return 301 https://in.symbcorp.ru$request_uri;
}

server {
    listen 80;
    server_name pay.symbcorp.ru;
    return 301 https://pay.symbcorp.ru$request_uri;
}

server {
    listen 80;
    server_name symbcorp.ru www.symbcorp.ru;
    return 301 https://symb62.ru$request_uri;
}
